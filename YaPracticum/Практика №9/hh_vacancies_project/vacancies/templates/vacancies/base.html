<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Вакансии{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .vacancy { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; }
        .logo img { max-width: 100px; }
        .salary { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🔎 Вакансии с HH.ru</h1>
        <nav>
            <a href="{% url 'vacancies:catalog' %}">Каталог</a>  |
            <a href="{% url 'vacancies:search' %}">Поиск и фильтры</a>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p>© 2025 HH Vacancies Project</p>
    </footer>
</body>
</html>
